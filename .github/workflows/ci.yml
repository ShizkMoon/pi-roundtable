name: Pi Roundtable CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cpp-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset dev
      - name: Build
        run: cmake --build --preset dev
      - name: Test
        run: ctest --preset dev

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:version
      - run: npm run check:schema
      - run: npm run build
      - run: npm test

  windows-client:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Resolve product version
        id: product-version
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath VERSION -Raw).Trim()
          if ($version -notmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') {
            throw 'VERSION must contain one three-part numeric product version without leading zeroes.'
          }
          $parts = @($version.Split('.') | ForEach-Object { [uint32]$_ })
          if ($parts[0] -gt 255 -or $parts[1] -gt 255 -or $parts[2] -gt 65535) {
            throw 'VERSION exceeds Windows Installer limits (major/minor <= 255 and patch <= 65535).'
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Pin verified packaging npm
        run: |
          npm install --global npm@12.0.1
          npm --version
      - run: npm ci
      - run: npm run check:version
      - run: npm run check:schema
      - run: npm run build
      - name: Configure native core
        run: cmake --preset dev
      - name: Build native core
        run: cmake --build --preset dev
      - name: Test native core
        run: ctest --preset dev
      - name: Test Windows client
        run: dotnet test apps/windows/tests/PiRoundtable.Windows.Tests/PiRoundtable.Windows.Tests.csproj --configuration Release
      - name: Parse PowerShell automation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem scripts -Filter '*.ps1' -File | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors)
            if ($errors.Count -gt 0) {
              throw "$($_.Name): $($errors[0].Message)"
            }
          }
      - name: Build self-contained Windows x64 MSI
        shell: pwsh
        # GitHub's Windows runner closes the WiX ICE validation pipe for this
        # large self-contained package. Release builds keep validation on;
        # CI still compiles the complete MSI after tests have passed.
        run: ./scripts/build-windows-x64.ps1 -Version '${{ steps.product-version.outputs.version }}' -SkipVerification -SuppressMsiValidation
      - name: Test Authenticode signing pipeline on copies
        shell: pwsh
        run: ./scripts/test-windows-signing-pipeline.ps1
      - name: Test isolated MSI lifecycle
        shell: pwsh
        # Exercise the actual Node/runtime-host payload. The shell-only fixture
        # remains available for quick local iterations, but cannot prove that a
        # production upgrade and uninstall remove the complete runtime tree.
        run: ./scripts/test-windows-msi-lifecycle.ps1 -UseFullPayload -SkipLaunch
      - uses: actions/upload-artifact@v4
        with:
          name: PiRoundtable-${{ steps.product-version.outputs.version }}-win-x64
          path: out/installer/PiRoundtable-${{ steps.product-version.outputs.version }}-win-x64.msi
          if-no-files-found: error
      - name: Upload Windows release QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PiRoundtable-windows-release-qa-${{ github.sha }}
          path: |
            out/e2e/signing-pipeline/signing-pipeline-report.json
            out/e2e/msi-lifecycle-*/msi-lifecycle-report.json
            out/e2e/msi-lifecycle-*/logs/*.log
          if-no-files-found: warn
