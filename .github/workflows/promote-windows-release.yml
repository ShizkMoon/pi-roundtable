name: Promote Windows release artifact

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful main-branch workflow run containing the Windows artifact
        required: true
        type: string
      release_tag:
        description: Existing draft release tag
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  promote:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      RUN_ID: ${{ inputs.run_id }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      WINDOWS_SIGNING_CERTIFICATE_THUMBPRINT: ${{ vars.WINDOWS_SIGNING_CERTIFICATE_THUMBPRINT }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify successful main artifact source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $run = gh api "repos/$env:REPOSITORY/actions/runs/$env:RUN_ID" | ConvertFrom-Json
          if ($run.status -ne 'completed' -or $run.conclusion -ne 'success') {
            throw "Run $env:RUN_ID is not a successful completed run."
          }
          if ($run.event -ne 'push' -or $run.head_branch -ne 'main') {
            throw "Run $env:RUN_ID is not a main-branch push run."
          }
          git merge-base --is-ancestor $run.head_sha HEAD
          if ($LASTEXITCODE -ne 0) {
            throw "Run commit $($run.head_sha) is not an ancestor of the checked-out main commit."
          }

      - name: Download Windows artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = Get-Content -Raw 'packaging/windows-x64/update-manifest.json' | ConvertFrom-Json
          $artifactName = [System.IO.Path]::GetFileNameWithoutExtension($manifest.asset.fileName)
          gh run download $env:RUN_ID --name $artifactName --dir release-asset
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to download artifact $artifactName from run $env:RUN_ID."
          }

      - name: Verify manifest binding and upload draft asset
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = Get-Content -Raw 'packaging/windows-x64/update-manifest.json' | ConvertFrom-Json
          $expectedUrl = "https://github.com/$env:REPOSITORY/releases/download/$env:RELEASE_TAG/$($manifest.asset.fileName)"
          if ($manifest.asset.url -ne $expectedUrl) {
            throw "Manifest URL does not bind to $env:RELEASE_TAG in $env:REPOSITORY."
          }
          $release = gh release view $env:RELEASE_TAG --json isDraft | ConvertFrom-Json
          if (!$release.isDraft) {
            throw "Release $env:RELEASE_TAG must remain a draft during artifact promotion."
          }
          function Assert-ReleaseMsi {
            param(
              [Parameter(Mandatory = $true)]
              [string]$Path,
              [Parameter(Mandatory = $true)]
              [object]$Manifest,
              [string]$ExpectedSigner = ''
            )
            $file = Get-Item -LiteralPath $Path
            $sha256 = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToUpperInvariant()
            if ($file.Length -ne [int64]$Manifest.asset.size -or
                $sha256 -ne ([string]$Manifest.asset.sha256).ToUpperInvariant()) {
              throw "$($file.FullName) does not match the manifest size and SHA-256."
            }
            if ($Manifest.asset.authenticodeRequired) {
              $signature = Get-AuthenticodeSignature -LiteralPath $file.FullName
              if ($signature.Status -ne 'Valid' -or
                  $null -eq $signature.SignerCertificate -or
                  $null -eq $signature.TimeStamperCertificate -or
                  $signature.SignerCertificate.Thumbprint.ToUpperInvariant() -ne $ExpectedSigner) {
                throw "$($file.FullName) does not have the required trusted, timestamped Authenticode signature. Status=$($signature.Status)."
              }
            }
          }
          $msiPath = Join-Path 'release-asset' $manifest.asset.fileName
          $msi = Get-Item -LiteralPath $msiPath
          $expectedSigner = ''
          if ($manifest.asset.authenticodeRequired) {
            $expectedSigner = ($env:WINDOWS_SIGNING_CERTIFICATE_THUMBPRINT -replace '\s', '').ToUpperInvariant()
            if ($expectedSigner -notmatch '^[0-9A-F]{40}$') {
              throw 'Repository variable WINDOWS_SIGNING_CERTIFICATE_THUMBPRINT must contain the production signing certificate SHA-1 thumbprint.'
            }
          }
          Assert-ReleaseMsi -Path $msi.FullName -Manifest $manifest -ExpectedSigner $expectedSigner
          gh release upload $env:RELEASE_TAG $msi.FullName --clobber
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to upload $($msi.Name) to release $env:RELEASE_TAG."
          }
          $asset = (gh release view $env:RELEASE_TAG --json assets | ConvertFrom-Json).assets |
            Where-Object name -eq $msi.Name |
            Select-Object -First 1
          if ($null -eq $asset -or [int64]$asset.size -ne $msi.Length) {
            throw 'Uploaded GitHub release asset size does not match the verified MSI.'
          }
          $uploadedAssetDirectory = Join-Path $env:RUNNER_TEMP "pi-roundtable-upload-$env:GITHUB_RUN_ID"
          New-Item -ItemType Directory -Force -Path $uploadedAssetDirectory | Out-Null
          gh release download $env:RELEASE_TAG --pattern $msi.Name --dir $uploadedAssetDirectory
          if ($LASTEXITCODE -ne 0) {
            throw 'Unable to download the uploaded GitHub release asset for independent verification.'
          }
          $uploadedMsi = Get-Item -LiteralPath (Join-Path $uploadedAssetDirectory $msi.Name)
          Assert-ReleaseMsi -Path $uploadedMsi.FullName -Manifest $manifest -ExpectedSigner $expectedSigner
